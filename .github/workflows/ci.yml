name: BUONOCANVAS CI
on:
  push:
    branches: ["main", "upgrade/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node --check server.mjs && node --check backup-utils.mjs && node --check pdf-vector.js && node --check v13-core.js
      - run: npm test
      - name: Browser navigation and export tests
        run: |
          set -o pipefail
          node tests/browser.mjs 2>&1 | tee browser-results.log
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: browser-results.log
          retention-days: 3
      - run: docker build -t buonocanvas-ci .
