<title>Daily Fit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Prompt:wght@300;400;500;600&display=swap">
<style>
/* Layout: one phone-width column on a grey ground. Strictly black and white: white rounded cards with line pictograms,
   one inverted (black) surface per screen for the thing that matters, and oversized tight numerals for every figure. */
:root{
  --bg:#E9E9E9;--surface:#FFFFFF;--sunk:#F0F0F0;--ink:#161616;--muted:#7B7B7B;--line:#DDDDDD;
  --accent:#161616;--accent-ink:#FFFFFF;--accent-soft:#E4E4E4;--icm:#BEBEBE;
  --f-ui:"Prompt","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --f-num:"Inter Tight","Prompt","Helvetica Neue",Arial,sans-serif;
  --r:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414;--surface:#1F1F1F;--sunk:#2A2A2A;--ink:#F2F2F2;--muted:#8F8F8F;--line:#343434;
  --accent:#F2F2F2;--accent-ink:#141414;--accent-soft:#303030;--icm:#565656;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414;--surface:#1F1F1F;--sunk:#2A2A2A;--ink:#F2F2F2;--muted:#8F8F8F;--line:#343434;
  --accent:#F2F2F2;--accent-ink:#141414;--accent-soft:#303030;--icm:#565656;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.03em}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{display:flex;align-items:center;gap:12px;min-height:52px}
.top h1{font-size:22px;font-weight:500;line-height:1.2;min-width:0;flex:1;letter-spacing:-.01em}
.top h1 small{display:block;font-size:13px;font-weight:300;color:var(--muted);letter-spacing:0}
.brand{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.brand small{display:block;font-size:13px;font-weight:300;color:var(--muted);letter-spacing:0;margin-top:2px}
.back{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.ghost{min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:400}

/* icons: single-weight line pictograms */
.ic{display:block;width:100%;height:100%;color:var(--ink)}
.ic path{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .b,.ic .a{stroke:currentColor}.ic .hd{fill:currentColor}.ic .m{stroke:var(--icm)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{min-height:78px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:300;color:var(--muted)}
.day b{font-family:var(--f-num);font-size:17px;font-weight:600;line-height:1;color:var(--ink)}
.day[disabled]{cursor:default}.day[disabled] b{color:var(--icm)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel b{color:var(--bg)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.dots i.c{background:none;box-shadow:inset 0 0 0 1.2px var(--ink)}
.day.sel .dots i{background:var(--bg)}.day.sel .dots i.c{background:none;box-shadow:inset 0 0 0 1.2px var(--bg)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.datebar input{min-height:40px;border-radius:999px;border:0;background:var(--surface);padding:0 12px;font-size:13px}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:var(--surface);border-radius:var(--r);padding:16px 16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.tile:active{transform:scale(.98)}
.tile .pic{width:88px;height:88px;margin:4px 0 10px}
.tile strong{font-size:20px;font-weight:500;line-height:1.25;letter-spacing:-.01em;order:2}
.tile .en{font-size:12px;font-weight:300;color:var(--muted);order:1}
.tile .sub{font-size:12px;font-weight:300;color:var(--muted);order:3;margin-top:6px}
.tile.ex strong{font-size:15px;font-weight:500;overflow-wrap:anywhere;order:0}
.tile.ex .pic{width:76px;height:76px}
.tile.ex .last{font-family:var(--f-num);font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.tile.add{background:none;border:1.5px dashed var(--icm);align-items:center;justify-content:center;font-weight:400;font-size:14px;min-height:150px;text-align:center}
.tile.add span{font-size:36px;font-weight:300;line-height:1}
.badge{display:inline-block;font-size:11px;font-weight:300;color:var(--muted)}
.done{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:42px;padding:0 16px;border-radius:999px;background:var(--surface);font-size:13px;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:var(--bg)}

/* today bar */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);border-radius:32px;padding:12px 12px 12px 22px;display:flex;align-items:center;gap:12px;z-index:5}
.bar .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.bar .txt small{font-size:12px;font-weight:300;opacity:.65}
.bar .txt b{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .go .ic{color:var(--ink)}
.bar .go{width:52px;height:52px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;flex:none;padding:12px}
.spacer{height:84px}

/* panels & forms */
.panel{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:15px;font-weight:500}
.hero{display:flex;align-items:center;gap:16px}
.hero .pic{width:92px;height:92px;flex:none}
.hero .info{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;font-weight:300}
.kv .num{font-size:20px}
.entry{display:grid;grid-template-columns:1fr 1fr minmax(0,2.2fr) 1fr 1fr;gap:6px;align-items:center}
.entry.two{grid-template-columns:1fr minmax(0,2.2fr) 1fr}
.step{min-height:54px;border-radius:999px;background:var(--sunk);font-family:var(--f-num);font-size:16px;font-weight:600;text-align:center}
.step:active{background:var(--accent-soft)}
.big{width:100%;min-height:84px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:none;text-align:center;font-family:var(--f-num);font-size:64px;font-weight:800;letter-spacing:-.04em;padding:0;-moz-appearance:textfield}
.big:focus-visible{outline:0;border-bottom-width:4px}
.big::placeholder{color:var(--icm)}
.big::-webkit-outer-spin-button,.big::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.entry.two .big{font-size:44px;min-height:64px}
.unit{text-align:center;font-size:12px;font-weight:300;color:var(--muted)}
.btn{min-height:60px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:500;text-align:center;padding:0 16px;width:100%}
.btn.alt{background:var(--surface);color:var(--ink)}
.panel .btn.alt{background:var(--sunk)}
.btn.danger{background:none;color:var(--muted);min-height:48px;font-size:13px;font-weight:300;text-decoration:underline}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f,span.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:300;color:var(--muted);min-width:0}
.inp{min-height:56px;border-radius:0;border:0;border-bottom:1.5px solid var(--line);background:none;padding:0 2px;font-size:18px;width:100%;color:var(--ink)}
.inp:focus-visible{outline:0;border-bottom-color:var(--ink)}
.inp.num{font-size:30px}
textarea.inp{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font-size:12px;min-height:120px;font-family:ui-monospace,Menlo,monospace}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{background:var(--sunk);border-radius:20px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-height:88px;justify-content:center}
.pick button .pic{width:44px;height:44px}
.pick button.on{background:var(--ink);color:var(--bg)}
.pick button.on .ic{color:var(--bg)}
.pick button.on .badge{color:var(--bg)}
.pick button .badge{font-size:14px;font-weight:400;color:var(--ink)}
.pick.icons{grid-template-columns:repeat(5,1fr);max-height:230px;overflow-y:auto}
.pick.icons button{min-height:60px;border-radius:16px}
.err{font-size:13px;font-weight:500}
.err::before{content:"! "}

/* result: the inverted surface */
.result{background:var(--ink);color:var(--bg);align-items:center;text-align:center;gap:6px;padding:28px 20px 20px}
.result .muted{color:inherit;opacity:.6}
.result .today{font-size:104px;font-weight:800;letter-spacing:-.05em;line-height:.95}
.delta{font-size:17px;font-weight:500;line-height:1.3;margin:8px 0 10px}
.pr{display:inline-block;background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:12px;font-weight:500;margin-bottom:6px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;text-align:left}
.vs div{border-top:1px solid rgba(128,128,128,.45);padding:12px 2px 0;display:flex;flex-direction:column}
.vs .num{font-size:24px;line-height:1.2}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .pic{width:40px;height:40px;flex:none}
.li .nm{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;overflow-wrap:anywhere}
.li .nm small{color:var(--muted);font-size:12px;font-weight:300}
.li .val{text-align:right;display:flex;flex-direction:column;align-items:flex-end;flex:none}
.li .val .num{font-size:20px;line-height:1.15}
.li .val small{font-size:11px;font-weight:400}
.li .spark{width:56px;height:24px;flex:none}
.x{width:44px;height:44px;border-radius:50%;background:var(--sunk);flex:none;text-align:center;font-size:12px;color:var(--muted)}
.x.arm{background:var(--ink);color:var(--bg)}
.mv{width:44px;height:44px;border-radius:50%;background:var(--sunk);flex:none;text-align:center;font-size:14px}
.mv[disabled]{opacity:.3;cursor:default}
.mv:active{background:var(--accent-soft)}
.li:has(.mv){gap:6px}
.menu{flex-direction:row;padding:10px}
.menu .btn{min-height:50px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px;padding:4px 4px 0}
.stat{display:flex;flex-direction:column-reverse}
.stat .num{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.stat span:not(.num){font-size:12px;font-weight:300;color:var(--muted)}
.panel .stat{background:none!important}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:999px;padding:4px;gap:2px}
.tabs button{min-height:42px;border-radius:999px;text-align:center;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav b{font-weight:500;text-align:center;flex:1;font-size:18px;letter-spacing:-.01em}
.pnav button{width:44px;height:44px;border-radius:50%;background:var(--surface);text-align:center;font-size:18px}
.pnav button[disabled]{opacity:.35}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-weight:300;font-size:14px}
.sec{font-size:12px;font-weight:300;color:var(--muted);margin-top:6px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:300;color:var(--muted)}
@media (max-width:360px){.entry{grid-template-columns:1fr minmax(0,2fr) 1fr}.entry .far{display:none}.tile strong{font-size:18px}.result .today{font-size:84px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const LS='dailyfit.v1';
const RE_D=/^\d{4}-\d{2}-\d{2}$/,RE_ID=/^[a-z0-9-]{1,40}$/;

let state={custom:[],order:{},lifts:{},cardio:{},weight:{},reps:{},t:{}};
const num=(v,max)=>{v=typeof v==='string'?parseFloat(v.replace(',','.')):+v;return isFinite(v)&&v>=0&&v<=max?Math.round(v*100)/100:null};
function sanCustom(a){const out=[];(Array.isArray(a)?a:[]).slice(0,300).forEach(c=>{
  if(!c||!RE_ID.test(c.id)||!PARTS.some(p=>p[0]===c.part)||!EQ[c.eq])return;
  out.push({id:c.id,part:c.part,name:String(c.name||'').slice(0,60)||'ท่าใหม่',eq:c.eq,icon:ICONS[c.icon]?c.icon:DEFICON[c.eq],unit:UNIT[c.unit]?c.unit:'kg',del:!!c.del});});return out}
function sanOrder(src){const o={};PARTS.forEach(p=>{const a=src&&src[p[0]];if(Array.isArray(a))o[p[0]]=a.filter(i=>typeof i==='string'&&RE_ID.test(i)).slice(0,400)});return o}
function sanLogs(src){const o={lifts:{},cardio:{},weight:{},reps:{}};src=src||{};
  Object.keys(src.reps||{}).forEach(d=>{if(!RE_D.test(d))return;const day={};Object.keys(src.reps[d]||{}).forEach(id=>{const v=num(src.reps[d][id],10000);if(RE_ID.test(id)&&v)day[id]=Math.round(v)});if(Object.keys(day).length)o.reps[d]=day});
  Object.keys(src.lifts||{}).forEach(d=>{if(!RE_D.test(d))return;const day={};Object.keys(src.lifts[d]||{}).forEach(id=>{const v=num(src.lifts[d][id],100000);if(RE_ID.test(id)&&v!==null)day[id]=v});if(Object.keys(day).length)o.lifts[d]=day});
  Object.keys(src.cardio||{}).forEach(d=>{if(!RE_D.test(d)||!Array.isArray(src.cardio[d]))return;const arr=[];src.cardio[d].slice(0,50).forEach(e=>{const m=num(e&&e.min,3000),k=num(e&&e.kcal,100000);
    if(m===null||!CARDIO.some(c=>c[0]===e.type))return;arr.push({id:RE_ID.test(e.id)?e.id:uid(),type:e.type,min:m,kcal:k||0})});if(arr.length)o.cardio[d]=arr});
  Object.keys(src.weight||{}).forEach(d=>{const v=num(src.weight[d],700);if(RE_D.test(d)&&v)o.weight[d]=v});return o}
function sanState(s){s=s||{};const l=sanLogs(s);const t={};Object.keys(s.t||{}).forEach(k=>{if(k==='cfg'||/^y\d{4}$/.test(k))t[k]=+s.t[k]||0});
  return {custom:sanCustom(s.custom),order:sanOrder(s.order),lifts:l.lifts,cardio:l.cardio,weight:l.weight,reps:l.reps,t}}
function uid(){return 'c'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)}
try{const raw=localStorage.getItem(LS);if(raw)state=sanState(JSON.parse(raw))}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}

/* cloud copy (only inside a Claude artifact; elsewhere this stays null and data lives in this browser) */
let cloud=null,syncState='local';const pending=new Set();let pushTimer=0;
function slice(k){if(k==='cfg')return {custom:state.custom,order:state.order};const y=k.slice(1),o={lifts:{},cardio:{},weight:{},reps:{}};
  LOGS.forEach(n=>Object.keys(state[n]).forEach(d=>{if(d.slice(0,4)===y)o[n][d]=state[n][d]}));return o}
function applySlice(k,obj,t){if(k==='cfg'){state.custom=sanCustom(obj.custom);state.order=sanOrder(obj.order)}else{const y=k.slice(1),l=sanLogs(obj);
  LOGS.forEach(n=>{Object.keys(state[n]).forEach(d=>{if(d.slice(0,4)===y)delete state[n][d]});
    Object.keys(l[n]).forEach(d=>{if(d.slice(0,4)===y)state[n][d]=l[n][d]})})}state.t[k]=t}
function setSync(s){syncState=s;const el=document.getElementById('sync');if(el)el.textContent=syncText()}
function syncText(){return syncState==='synced'?'ซิงก์กับบัญชี Claude แล้ว':syncState==='saving'?'กำลังซิงก์…':syncState==='error'?'ซิงก์ไม่สำเร็จ ข้อมูลยังอยู่ในเครื่องนี้':'เก็บข้อมูลไว้ในเบราว์เซอร์นี้'}
function flush(){if(!cloud||!pending.size)return;const keys=[...pending];pending.clear();setSync('saving');
  cloud.q=cloud.q.then(()=>Promise.all(keys.map(k=>cloud.col.doc(k).set({t:state.t[k]||Date.now(),data:JSON.stringify(slice(k))}))))
    .then(()=>{if(!pending.size)setSync('synced')},()=>setSync('error'))}
function touch(k){state.t[k]=Date.now();saveLocal();if(cloud){pending.add(k);clearTimeout(pushTimer);pushTimer=setTimeout(flush,700)}}
const touchDay=d=>touch('y'+d.slice(0,4));
async function initCloud(){try{
  if(!window.claude||typeof window.claude.use!=='function')return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const col=db.collection('data/users/'+id);const snap=await col.get();
  cloud={col,q:Promise.resolve()};const seen={};let changed=false;
  snap.docs.forEach(d=>{const b=d.data();if(!b||!(d.id==='cfg'||/^y\d{4}$/.test(d.id)))return;seen[d.id]=1;const ct=+b.t||0,lt=state.t[d.id]||0;
    if(ct>lt){try{applySlice(d.id,JSON.parse(b.data),ct);changed=true}catch(e){}}else if(lt>ct)pending.add(d.id)});
  Object.keys(state.t).forEach(k=>{if(!seen[k])pending.add(k)});
  if(changed){saveLocal();render()}
  if(pending.size)flush();else setSync('synced');
}catch(e){setSync(cloud?'error':'local')}}

function spark(vals){if(vals.length<2)return '';const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const p=vals.map((v,i)=>[2+i*60/(vals.length-1),22-(v-mn)/r*18]);
  return `<svg class="spark" viewBox="0 0 64 26" aria-hidden="true"><path d="M${p.map(a=>a[0].toFixed(1)+' '+a[1].toFixed(1)).join('L')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${p[p.length-1][0]}" cy="${p[p.length-1][1].toFixed(1)}" r="3" fill="var(--accent)"/></svg>`}
function lineChart(pts,unit){ // pts:[{label,v}]
  if(pts.length<2)return '';const vs=pts.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx===mn){mx+=1;mn-=1}
  const X0=40,X1=306,Y0=14,Y1=92,x=i=>X0+i*(X1-X0)/(pts.length-1),y=v=>Y1-(v-mn)/(mx-mn)*(Y1-Y0);
  const d=pts.map((p,i)=>x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join('L'),last=pts.length-1;
  return `<svg class="chart" viewBox="0 0 320 116" role="img" aria-label="กราฟ ${esc(unit)} จาก ${fmt(pts[0].v)} ถึง ${fmt(pts[last].v)}">
  <path d="M${X0} ${Y0}H${X1}M${X0} ${Y1}H${X1}" stroke="var(--line)" stroke-width="1" fill="none"/>
  <path d="M${d}L${X1} ${Y1}L${X0} ${Y1}Z" fill="var(--accent-soft)" stroke="none"/>
  <path d="M${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${x(last)}" cy="${y(pts[last].v).toFixed(1)}" r="4.5" fill="var(--accent)"/>
  <text x="${X0-6}" y="${Y0+4}" text-anchor="end">${fmt(mx)}</text><text x="${X0-6}" y="${Y1+4}" text-anchor="end">${fmt(mn)}</text>
  <text x="${X0}" y="110">${esc(pts[0].label)}</text><text x="${X1}" y="110" text-anchor="end">${esc(pts[last].label)}</text></svg>`}
function barChart(bars,unit){ // bars:[{label,v,show}]
  const mx=Math.max(...bars.map(b=>b.v));if(!(mx>0))return '';
  const X0=40,X1=314,Y0=14,Y1=92,w=(X1-X0)/bars.length,bw=Math.max(2,Math.min(26,w*0.7));
  return `<svg class="chart" viewBox="0 0 320 116" role="img" aria-label="กราฟแท่ง ${esc(unit)} สูงสุด ${fmt(mx)}">
  <path d="M${X0} ${Y0}H${X1}M${X0} ${Y1}H${X1}" stroke="var(--line)" stroke-width="1" fill="none"/>
  <text x="${X0-6}" y="${Y0+4}" text-anchor="end">${fmt(mx)}</text><text x="${X0-6}" y="${Y1+4}" text-anchor="end">0</text>
  ${bars.map((b,i)=>{const h=b.v/mx*(Y1-Y0),cx=X0+w*(i+.5);return (b.v>0?`<rect x="${(cx-bw/2).toFixed(1)}" y="${(Y1-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3,bw/2)}" fill="var(--ink)"/>`:'')+(b.show?`<text x="${cx.toFixed(1)}" y="110" text-anchor="middle">${esc(b.label)}</text>`:'')}).join('')}</svg>`}

function period(kind,off){
  const t=parse(today());let s,e,label,buckets=[];
  if(kind==='day'){s=e=addDays(parse(cur),off);label=key(s)===today()?'วันนี้ '+dl(key(s)):WD[s.getDay()]+' '+dl(key(s))}
  else if(kind==='week'){s=addDays(t,-((t.getDay()+6)%7)+off*7);e=addDays(s,6);label=dl(key(s))+' – '+dl(key(e));
    for(let i=0;i<7;i++){const k=key(addDays(s,i));buckets.push({label:WD[(i+1)%7],a:k,b:k,show:1})}}
  else if(kind==='month'){s=new Date(t.getFullYear(),t.getMonth()+off,1);e=new Date(s.getFullYear(),s.getMonth()+1,0);label=MON[s.getMonth()]+' '+(s.getFullYear()+543);
    for(let i=1;i<=e.getDate();i++){const k=key(new Date(s.getFullYear(),s.getMonth(),i));buckets.push({label:String(i),a:k,b:k,show:i%7===1})}}
  else{s=new Date(t.getFullYear()+off,0,1);e=new Date(s.getFullYear(),11,31);label='ปี '+(s.getFullYear()+543);
    for(let i=0;i<12;i++)buckets.push({label:MON[i].replace(/\./g,''),a:key(new Date(s.getFullYear(),i,1)),b:key(new Date(s.getFullYear(),i+1,0)),show:i%2===0})}
  return {a:key(s),b:key(e),label,buckets};
}
function vSummary(){
  const P=period(sumKind,sumOff),Q=sumKind==='day'?null:period(sumKind,sumOff-1),inP=d=>d>=P.a&&d<=P.b;
  const ld=Object.keys(state.lifts).filter(inP).sort(),cd=Object.keys(state.cardio).filter(inP).sort(),wd=Object.keys(state.weight).filter(inP).sort();
  const active=new Set(ld.concat(cd)).size;let nl=0;const best={},bestR={};
  ld.forEach(d=>Object.keys(state.lifts[d]).forEach(id=>{nl++;const v=state.lifts[d][id];if(!best[id]||v>=Math.max(...best[id]))bestR[id]=(state.reps[d]||{})[id]||0;(best[id]=best[id]||[]).push(v)}));
  let tm=0,tk=0;const byType={};cd.forEach(d=>state.cardio[d].forEach(e=>{tm+=e.min;tk+=e.kcal;const o=byType[e.type]=byType[e.type]||{n:0,min:0,kcal:0};o.n++;o.min+=e.min;o.kcal+=e.kcal}));
  const tabs=[['day','วัน'],['week','สัปดาห์'],['month','เดือน'],['year','ปี']].map(([k,l])=>`<button class="${sumKind===k?'on':''}" data-kind="${k}">${l}</button>`).join('');
  const canNext=sumKind==='day'?key(addDays(parse(cur),sumOff))<today():sumOff<0;
  let strength='';
  PARTS.forEach(p=>{const rows=allEx().filter(e=>e.part===p[0]&&best[e.id]).map(e=>{const vals=best[e.id],mx=Math.max(...vals),u=UNIT[e.unit];let pv=null;
      if(Q){Object.keys(state.lifts).forEach(d=>{if(d>=Q.a&&d<=Q.b&&state.lifts[d][e.id]!=null)pv=Math.max(pv===null?0:pv,state.lifts[d][e.id])})}
      else{const h=hist(e.id).filter(x=>x.d<P.a).pop();if(h)pv=h.v}

      return `<div class="li">${pic(e.icon,e.eq)}<span class="nm">${esc(e.name)}<small>${vals.length>1?'จด '+vals.length+' วัน':EQ[e.eq]}${bestR[e.id]?' · × '+bestR[e.id]+' ครั้ง':''}</small></span>${spark(vals)}<span class="val"><span class="num">${fmt(mx)} ${u}</span><small class="${diff>0?'up':diff<0?'down':'muted'}">${diff===null?'ครั้งแรก':diff===0?'เท่าเดิม':(diff>0?'▲ ':'▼ ')+sign(diff)}</small></span></div>`});
    if(rows.length)strength+=`<div class="sec">${p[1]}</div><div class="list">${rows.join('')}</div>`});
  const cmp=sumKind==='day'?'เทียบกับครั้งก่อน':sumKind==='week'?'เทียบกับสัปดาห์ก่อน':sumKind==='month'?'เทียบกับเดือนก่อน':'เทียบกับปีก่อน';
  const bars=P.buckets.map(b=>({label:b.label,show:b.show,v:cd.filter(d=>d>=b.a&&d<=b.b).reduce((s,d)=>s+state.cardio[d].reduce((x,e)=>x+e.min,0),0)}));
  const w0=wd.length?state.weight[wd[0]]:null,w1=wd.length?state.weight[wd[wd.length-1]]:null;
  const wPrev=Object.keys(state.weight).filter(d=>d<P.a).sort().pop(),wBase=sumKind==='day'||wd.length<2?(wPrev?state.weight[wPrev]:null):w0;
  const nothing=!ld.length&&!cd.length&&!wd.length;
  return `<header class="top">${backBtn('')}<h1>สรุปผล<small>ความคืบหน้าของคุณ</small></h1></header>
  <div class="tabs">${tabs}</div>
  <div class="pnav"><button data-off="-1" aria-label="ก่อนหน้า">‹</button><b>${P.label}</b><button data-off="1"${canNext?'':' disabled'} aria-label="ถัดไป">›</button></div>
  ${nothing?'<div class="panel"><p class="empty">ยังไม่มีข้อมูลในช่วงนี้ กลับไปหน้าแรกแล้วเลือกส่วนที่เล่นเพื่อเริ่มจด</p></div>':`
  <div class="stats">
    ${sumKind==='day'?`<div class="stat"><span class="num">${w1?fmt(w1):'–'}</span><span>น้ำหนักตัว (กก.)</span></div>`:`<div class="stat"><span class="num">${active}</span><span>วันที่ออกกำลัง</span></div>`}
    <div class="stat"><span class="num">${sumKind==='day'?nl:Object.keys(best).length}</span><span>${sumKind==='day'?'ท่าที่เล่น':'ท่าที่มีสถิติ'}</span></div>
    <div class="stat"><span class="num">${fmt(tm)}</span><span>นาทีคาร์ดิโอ</span></div>
    <div class="stat"><span class="num">${fmt(tk)}</span><span>kcal จากคาร์ดิโอ</span></div></div>
  ${strength?`<div class="panel"><h2>เวทเทรนนิ่ง <span class="small muted" style="font-weight:400">สูงสุดในช่วงนี้ · ${cmp}</span></h2>${strength}</div>`:''}
  ${cd.length?`<div class="panel"><h2>คาร์ดิโอ <span class="small muted" style="font-weight:400">${fmt(tm)} นาที · ${fmt(tk)} kcal</span></h2>${sumKind==='day'?'':barChart(bars,'นาที')}
    <div class="list">${CARDIO.filter(c=>byType[c[0]]).map(c=>{const o=byType[c[0]];return `<div class="li">${pic(c[2],'cb')}<span class="nm">${c[1]}<small>${o.n} ครั้ง · ${fmt(o.min)} นาที</small></span><span class="val"><span class="num">${fmt(o.kcal)}</span><small class="muted">kcal</small></span></div>`}).join('')}</div></div>`:''}
  ${wd.length?`<div class="panel"><h2>น้ำหนักตัว</h2><div class="kv"><span class="muted">ล่าสุด · ${dl(wd[wd.length-1])}</span><span class="num">${fmt(w1)} กก.</span></div>
    ${wBase!==null?`<div class="kv"><span class="muted">${wd.length>1&&sumKind!=='day'?'เปลี่ยนแปลงในช่วงนี้':'เทียบกับครั้งก่อน'}</span><span class="num">${sign(w1-wBase)} กก.</span></div>`:''}
    ${lineChart(wd.map(d=>({label:dl(d),v:state.weight[d]})),'กก.')}</div>`:''}`}`;
}

function render(){
  const r=route();let html;const p=partOf(r);
  if(p)html=vPart(p);
  else if(r.startsWith('x-')&&exById(r.slice(2)))html=vEx(exById(r.slice(2)));
  else if(r.startsWith('add-')&&partOf(r.slice(4)))html=vAdd(partOf(r.slice(4)));
  else if(r==='cardio')html=vCardio();
  else if(r==='bodyweight')html=vWeight();
  else if(r==='summary')html=vSummary();
  else html=vHome();
  app.innerHTML=html;
}
window.addEventListener('hashchange',()=>{saved=null;armed=null;msg='';menu=false;editing=false;filter=route().startsWith('x-')||partOf(route())?filter:'all';render();window.scrollTo(0,0)});

/* ---------- actions ---------- */
const val=id=>{const el=document.getElementById(id);return el?num(el.value,100000):null};
function arm(k,fn){if(armed===k){armed=null;fn()}else{armed=k;render()}}
app.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.go!==undefined){if(d.go==='summary'){sumOff=0}go(d.go);return}
  if(d.day){cur=d.day;render();return}
  if(d.filter){filter=d.filter;render();return}
  if(d.move){const pid=route(),ids=partList(pid).map(e=>e.id),i=ids.indexOf(d.id);if(i<0)return;ids.splice(i,1);ids.splice(d.move==='top'?0:d.move==='up'?Math.max(0,i-1):i+1,0,d.id);state.order[pid]=ids;touch('cfg');render();return}
  if(d.step){const el=document.getElementById(d.for||'val'),v=Math.max(0,Math.round(((parseFloat(el.value)||0)+ +d.step)*100)/100);el.value=v;return}
  if(d.kind){sumKind=d.kind;sumOff=0;render();return}
  if(d.off){sumOff+= +d.off;render();return}
  if(d.ctype){const m=document.getElementById('cmin').value,k=document.getElementById('ckcal').value;cardioType=d.ctype;render();document.getElementById('cmin').value=m;document.getElementById('ckcal').value=k;return}
  if(d.eq||d.icon){addForm.name=document.getElementById('newname').value;if(d.eq){addForm.eq=d.eq;addForm.icon=''}else addForm.icon=d.icon;
    const box=app.querySelector('.pick.icons'),st=box?box.scrollTop:0;render();const nb=app.querySelector('.pick.icons');if(nb)nb.scrollTop=st;return}
  if(d.delc){arm('c'+d.delc,()=>{state.cardio[cur]=(state.cardio[cur]||[]).filter(e=>e.id!==d.delc);if(!state.cardio[cur].length)delete state.cardio[cur];touchDay(cur);render()});return}
  if(d.delw){arm('w'+d.delw,()=>{delete state.weight[d.delw];touchDay(d.delw);render()});return}
  const r=route(),ex=r.startsWith('x-')?exById(r.slice(2)):null;msg='';
  switch(d.act){
    case 'save-lift':{const v=val('val');if(v===null||v<=0){msg='ใส่ตัวเลขที่มากกว่า 0 ก่อนกดบันทึก';render();return}
      const rp=ex.unit==='kg'?val('reps'):null;(state.lifts[cur]=state.lifts[cur]||{})[ex.id]=v;
      if(rp)(state.reps[cur]=state.reps[cur]||{})[ex.id]=Math.round(rp);else if(state.reps[cur])delete state.reps[cur][ex.id];touchDay(cur);saved=ex.id;armed=null;render();window.scrollTo(0,0);break}
    case 'edit':saved=null;render();break;
    case 'menu':menu=!menu;render();break;
    case 'reorder':menu=false;editing=true;filter='all';render();window.scrollTo(0,0);break;
    case 'reorder-done':editing=false;render();window.scrollTo(0,0);break;
    case 'del-lift':arm('lift',()=>{delete state.lifts[cur][ex.id];if(state.reps[cur])delete state.reps[cur][ex.id];if(!Object.keys(state.lifts[cur]).length)delete state.lifts[cur];touchDay(cur);render()});break;
    case 'del-ex':arm('ex',()=>{ex.del=true;touch('cfg');go(ex.part)});break;
    case 'save-ex':{const name=document.getElementById('newname').value.trim();addForm.name=name;if(!name){msg='ตั้งชื่อท่าก่อนกดเพิ่ม';render();return}
      const e={id:uid(),part:addForm.part,name:name.slice(0,60),eq:addForm.eq,icon:addForm.icon||DEFICON[addForm.eq],unit:addForm.eq==='bw'?'rep':'kg'};
      state.custom.push(e);addForm=null;touch('cfg');go('x-'+e.id);break}
    case 'add-cardio':{const m=val('cmin'),k=val('ckcal');if(m===null||m<=0){msg='ใส่จำนวนนาทีก่อนกดเพิ่ม';render();return}
      (state.cardio[cur]=state.cardio[cur]||[]).push({id:uid(),type:cardioType,min:m,kcal:k||0});touchDay(cur);render();break}
    case 'finish':sumKind=cur===today()&&route()===''?'week':'day';sumOff=0;go('summary');break;
    case 'save-weight':{const v=num(document.getElementById('val').value,700);if(!v){msg='ใส่น้ำหนักตัวเป็นกิโลกรัมก่อนกดบันทึก';render();return}
      state.weight[cur]=v;touchDay(cur);render();break}
    case 'backup':showBackup=!showBackup;armed=null;render();break;
    case 'copy':{const ta=document.getElementById('bk');const done=()=>{msg='คัดลอกแล้ว';render()};
      try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();msg='เลือกข้อความไว้แล้ว กดคัดลอกจากเมนูของเครื่อง';})}catch(e){ta.select()}break}
    case 'import':{const txt=document.getElementById('bk').value;let obj;try{obj=JSON.parse(txt)}catch(e){msg='ข้อมูลที่วางอ่านไม่ได้ ตรวจว่าคัดลอกมาครบทั้งหมด';render();document.getElementById('bk').value=txt;return}
      if(armed!=='import'){armed='import';render();document.getElementById('bk').value=txt;return}
      armed=null;const old=Object.keys(state.t),s=sanState(obj);state.custom=s.custom;state.order=s.order;state.reps=s.reps;state.lifts=s.lifts;state.cardio=s.cardio;state.weight=s.weight;
      const ks=new Set(old.concat(['cfg']));LOGS.forEach(n=>Object.keys(state[n]).forEach(dd=>ks.add('y'+dd.slice(0,4))));ks.forEach(touch);
      msg='นำเข้าข้อมูลแล้ว';render();break}
  }
});
app.addEventListener('change',ev=>{if(ev.target.id==='pickdate'&&RE_D.test(ev.target.value)&&ev.target.value<=today()){cur=ev.target.value;render()}});
app.addEventListener('keydown',ev=>{if(ev.key!=='Enter'||ev.target.tagName!=='INPUT')return;const b=app.querySelector('[data-act^="save-"],[data-act="add-cardio"]');if(b){ev.preventDefault();b.click()}});
app.addEventListener('focusin',ev=>{if(ev.target.classList&&ev.target.classList.contains('big'))ev.target.select()});

render();initCloud();
})();
</script>
